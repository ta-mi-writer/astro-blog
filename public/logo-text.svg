<svg xmlns="http://www.w3.org/2000/svg" viewBox="131 0 364 120" width="364" height="120" role="img" aria-label="メルシー艶ログ ロゴ (隙間30%)">
  <defs>
    <!-- ネオンシアン基調のグラデーション定義 -->
    <linearGradient id="neonCyanGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--accent-blue-deep)" />
      <stop offset="50%" stop-color="var(--accent-cyan)" />
      <stop offset="100%" stop-color="var(--accent-cyan-bright)" />
    </linearGradient>

    <linearGradient id="softCyanGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--accent-cyan-dim)" />
      <stop offset="100%" stop-color="var(--accent-cyan)" />
    </linearGradient>

    <!-- 背景のアンビエント光彩 -->
    <radialGradient id="bgGaze2" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--accent-cyan)" stop-opacity="0.25" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="accentGaze2" cx="70%" cy="50%" r="60%">
      <stop offset="0%" stop-color="var(--accent-blue-deep)" stop-opacity="0.2" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <!-- きらめきシンボル -->
    <g id="sparkle2">
      <path d="M 0,-12 Q 0,-2 10,0 Q 0,2 0,12 Q 0,2 -10,0 Q 0,-2 0,-12 Z" fill="var(--accent-cyan-bright)" />
      <circle cx="0" cy="0" r="1.5" fill="var(--text-primary)" />
    </g>
  </defs>

  <style>
    :root, svg {
      --bg-paper: transparent;
      --text-primary: oklch(96% 0.005 240);
      --text-secondary: oklch(78% 0.01 240);
      --text-muted: oklch(58% 0.015 240);
      --accent-cyan: oklch(70% 0.18 265);
      --accent-cyan-bright: oklch(82% 0.13 265);
      --accent-cyan-dim: oklch(60% 0.22 265);
      --accent-blue-deep: oklch(50% 0.25 265);
    }
    .title-text {
      font-family: "Shippori Mincho", "Yu Mincho", "Hiragino Mincho ProN", "Source Han Serif", serif;
    }
    .sub-text {
      font-family: "Space Grotesk", "Montserrat", "Helvetica Neue", sans-serif;
      letter-spacing: 0.32em;
    }
  </style>

  <!-- 背景 -->
  <rect width="100%" height="100%" rx="12" fill="transparent" />
  <rect width="100%" height="100%" rx="12" fill="url(#bgGaze2)" />
  <rect width="100%" height="100%" rx="12" fill="url(#accentGaze2)" />

  <!-- === テキストエリア（左アイコン部分を除外） === -->
  <g transform="translate(131, 70)">
    <text class="title-text" font-size="44" font-weight="500">
      <tspan x="0" fill="var(--text-primary)">メルシー</tspan>
      <tspan x="195" fill="url(#neonCyanGrad2)" font-size="50" font-weight="700">艶</tspan>
      <tspan x="254" fill="var(--text-primary)">ロ</tspan>
      <tspan x="304" fill="var(--text-primary)">ク</tspan>
    </text>

    <!-- 「ク」の濁点 -->
    <g transform="translate(347, -31) rotate(15) scale(0.5)">
      <use href="#sparkle2" />
    </g>
    <g transform="translate(359, -36) rotate(15) scale(0.5)">
      <use href="#sparkle2" />
    </g>
  </g>

  <!-- ボーダーライン -->
  <line x1="133" y1="81" x2="495" y2="81" stroke="url(#neonCyanGrad2)" stroke-width="1" opacity="0.45" />

  <!-- 欧文サブタイトル -->
  <g transform="translate(135, 92)" class="sub-text">
    <text x="20" font-size="11.5" font-weight="600" fill="var(--text-secondary)">MERCI TSUYA LOG</text>
    <text x="210" font-size="10" fill="var(--accent-cyan)">✦</text>
    <text x="236" font-size="11" font-weight="600" fill="var(--accent-cyan-bright)" letter-spacing="0.4em">ADULT BLOG</text>
  </g>
</svg>
