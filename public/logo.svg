<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img" aria-label="メルシー艶ログ ロゴ">
  <defs>
    <!-- カラーパレットに基づくグラデーション定義 -->
    <linearGradient id="plumCrimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--accent-plum)" />
      <stop offset="50%" stop-color="var(--accent-crimson)" />
      <stop offset="100%" stop-color="var(--accent-rose)" />
    </linearGradient>

    <linearGradient id="softGazeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--accent-crimson-dark)" />
      <stop offset="100%" stop-color="var(--accent-plum)" />
    </linearGradient>

    <!-- 背景のアンビエント光彩 -->
    <radialGradient id="bgGaze" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--accent-plum-dark)" stop-opacity="0.35" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="accentGaze" cx="70%" cy="50%" r="60%">
      <stop offset="0%" stop-color="var(--accent-crimson-dark)" stop-opacity="0.2" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <!-- きらめきシンボル -->
    <g id="sparkle">
      <path d="M 0,-12 Q 0,-2 10,0 Q 0,2 0,12 Q 0,2 -10,0 Q 0,-2 0,-12 Z" fill="var(--accent-rose)" />
      <circle cx="0" cy="0" r="1.5" fill="var(--text-primary)" />
    </g>
  </defs>

  <style>
    :root, svg {
      --text-primary: oklch(96% 0.005 210);
      --text-secondary: oklch(76% 0.01 210);
      --text-muted: oklch(58% 0.015 210);
      --accent-plum: oklch(70% 0.22 310);
      --accent-plum-dark: oklch(58% 0.25 310);
      --accent-crimson: oklch(65% 0.24 25);
      --accent-crimson-dark: oklch(55% 0.26 25);
      --accent-rose: oklch(72% 0.12 20);
    }
    .title-text {
      font-family: "Shippori Mincho", "Yu Mincho", "Hiragino Mincho ProN", "Source Han Serif", serif;
    }
    .sub-text {
      font-family: "Montserrat", "Helvetica Neue", "Arial", sans-serif;
      letter-spacing: 0.32em;
    }
  </style>

  <!-- 背景（黒・リッチブラック＋光彩） -->
  <rect width="100%" height="100%" rx="16" fill="#0b0a0e" />
  <rect width="100%" height="100%" rx="16" fill="url(#bgGaze)" />
  <rect width="100%" height="100%" rx="16" fill="url(#accentGaze)" />

  <!-- === 左側：艶モノグラム・シンボル === -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="54" fill="none" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 3" opacity="0.45" />
    <circle cx="0" cy="0" r="46" fill="none" stroke="url(#plumCrimsonGrad)" stroke-width="1.2" opacity="0.75" />

    <!-- ドロップシェイプ -->
    <path d="M 0,-42 C 26,-15 36,10 24,32 C 14,48 -14,48 -24,32 C -36,10 -26,-15 0,-42 Z"
          fill="url(#softGazeGrad)" opacity="0.85" />
    <path d="M 0,-36 C 18,-12 28,10 18,28 C 10,40 -10,40 -18,28 C -28,10 -18,-12 0,-36 Z"
          fill="url(#plumCrimsonGrad)" />

    <!-- ハイライト光 -->
    <path d="M -5,-26 C 6,-10 10,6 6,18 C 3,24 -4,26 -7,20 C -1,8 -1,-12 -5,-26 Z"
          fill="var(--text-primary)" opacity="0.45" />

    <!-- 「M」ライン -->
    <path d="M -14,14 L -14,-4 L -1,-16 L 0,-16 L 13,-4 L 13,14 M -14,5 L -1,15 L 0,15 L 13,5"
          fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <use href="#sparkle" x="38" y="-32" transform="scale(0.85)" />
    <use href="#sparkle" x="-32" y="34" transform="scale(0.65)" />
  </g>

  <!-- === 右側：テキストエリア === -->
  <g transform="translate(200, 112)">
    <!-- タイトル本体 -->
    <text class="title-text" font-size="44" font-weight="500">
      <tspan x="0" fill="var(--text-primary)">メルシー</tspan>
      <tspan x="195" fill="url(#plumCrimsonGrad)" font-size="50" font-weight="700">艶</tspan>
      <tspan x="254" fill="var(--text-primary)">ロ</tspan>
      <tspan x="304" fill="var(--text-primary)">ク</tspan>
    </text>

    <!-- 「ク」の濁点（゛）：星をサイズアップし、間隔を最適化 -->
    <!-- 濁点 1点目（左下） -->
    <g transform="translate(347, -31) rotate(15) scale(0.5)">
      <use href="#sparkle" />
    </g>
    <!-- 濁点 2点目（右上） -->
    <g transform="translate(359, -36) rotate(15) scale(0.5)">
      <use href="#sparkle" />
    </g>
  </g>

  <!-- ボーダーライン -->
  <line x1="202" y1="134" x2="680" y2="134" stroke="url(#plumCrimsonGrad)" stroke-width="1" opacity="0.45" />

  <!-- === 欧文サブタイトル === -->
  <g transform="translate(204, 156)" class="sub-text">
    <text font-size="11.5" font-weight="600" fill="var(--text-secondary)">
      MERCI TSUYA LOG
    </text>
    <text x="210" font-size="10" fill="var(--accent-crimson)">✦</text>
    <text x="236" font-size="11" font-weight="600" fill="var(--accent-rose)" letter-spacing="0.4em">
      ADULT BLOG
    </text>
  </g>
</svg>
